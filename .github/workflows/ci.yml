name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build (tsc -b, also type-checks)
        run: pnpm build
      - name: lint
        run: pnpm lint
      - name: architecture rules (dependency-cruiser)
        run: pnpm depcruise
      - name: install Chromium for @quiesco/web tests
        run: pnpm --filter @quiesco/web exec playwright install --with-deps chromium
      - name: unit tests
        run: pnpm test
      - name: type-check the example app
        run: pnpm typecheck:examples

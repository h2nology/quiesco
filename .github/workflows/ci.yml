name: ci

on:
  push:
    branches: [main]
    # Docs, the Claude Code plugin, plans and the top-level .md files alone need no build or unit tests
    # (package READMEs stay: @quiesco/steps tests its README's table).
    paths-ignore:
      - docs/**
      - plugin/**
      - .planning/**
      - '*.md'
  pull_request:
    # Docs, the Claude Code plugin, plans and the top-level .md files alone need no build or unit tests
    # (package READMEs stay: @quiesco/steps tests its README's table).
    paths-ignore:
      - docs/**
      - plugin/**
      - .planning/**
      - '*.md'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build (tsc -b, also type-checks)
        run: pnpm build
      - name: lint
        run: pnpm lint
      - name: docs types page up to date
        run: node scripts/build-api-types.mjs --check
      - name: architecture rules (dependency-cruiser)
        run: pnpm depcruise
      - name: install the browsers for @quiesco/web tests (Chromium, Firefox, WebKit)
        run: pnpm --filter @quiesco/web exec playwright install --with-deps chromium firefox webkit
      - name: unit tests
        run: pnpm test
      - name: type-check the example app
        run: pnpm typecheck:examples

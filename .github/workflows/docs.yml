# Documentation site check (scripts/check-docs.mjs): navigation, translations keep the English structure,
# `mint validate` and `mint broken-links --check-anchors`. Kept out of ci.yml / `pnpm check` because it
# downloads the Mintlify CLI.
name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - scripts/check-docs.mjs
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - scripts/check-docs.mjs
      - .github/workflows/docs.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: docs check
        run: node scripts/check-docs.mjs
